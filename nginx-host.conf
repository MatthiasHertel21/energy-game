# Nginx Reverse Proxy Configuration für marketsimulationgame.energy
# Dieser Proxy läuft auf dem Host und leitet zu Traefik (Port 18080) weiter

server {
    listen 80;
    listen [::]:80;
    server_name marketsimulationgame.energy www.marketsimulationgame.energy;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marketsimulationgame.energy www.marketsimulationgame.energy;

    # SSL Zertifikate (Pfade für Let's Encrypt mit Certbot)
    ssl_certificate /etc/letsencrypt/live/marketsimulationgame.energy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketsimulationgame.energy/privkey.pem;

    # SSL Konfiguration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip Kompression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # Proxy zu Traefik (läuft auf localhost:18080)
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket Support für Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:18080/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Uploads Verzeichnis
    location /uploads/ {
        proxy_pass http://127.0.0.1:18080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect www zu non-www (optional)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.marketsimulationgame.energy;

    ssl_certificate /etc/letsencrypt/live/marketsimulationgame.energy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketsimulationgame.energy/privkey.pem;

    return 301 https://marketsimulationgame.energy$request_uri;
}
