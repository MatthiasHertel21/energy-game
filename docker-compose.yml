services:
  traefik:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "18080:80"
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    mem_reservation: 64m
    mem_limit: 256m
    pids_limit: 128

  backend:
    build: ./backend
    init: true
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      - web
    ports:
      - "15000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./debug:/app/debug
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.services.backend.loadbalancer.server.port=5000
      - traefik.http.routers.backend-sio.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/socket.io`)
      - traefik.http.routers.backend-sio.entrypoints=web
      - traefik.http.routers.uploads.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/uploads`)
      - traefik.http.routers.uploads.entrypoints=web
      # Local fallback (no Host) for localhost:18080
      - traefik.http.routers.backend-local.rule=PathPrefix(`/api`)
      - traefik.http.routers.backend-local.entrypoints=web
      - traefik.http.routers.backend-sio-local.rule=PathPrefix(`/socket.io`)
      - traefik.http.routers.backend-sio-local.entrypoints=web
      - traefik.http.routers.uploads-local.rule=PathPrefix(`/uploads`)
      - traefik.http.routers.uploads-local.entrypoints=web
    restart: unless-stopped
    mem_reservation: 512m
    mem_limit: 2560m
    pids_limit: 256
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=${VITE_API_BASE}
    init: true
    networks:
      - web
    ports:
      - "18081:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=80
      # Local fallback (no Host) for localhost:18080
      - traefik.http.routers.frontend-local.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend-local.entrypoints=web
    depends_on:
      - backend
    restart: unless-stopped
    mem_reservation: 64m
    mem_limit: 256m
    pids_limit: 128
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web
    restart: unless-stopped
    mem_reservation: 512m
    mem_limit: 2048m
    pids_limit: 256
    stop_grace_period: 60s

  redis:
    image: redis:7
    networks:
      - web
    restart: unless-stopped
    mem_reservation: 64m
    mem_limit: 256m
    pids_limit: 128
    stop_grace_period: 30s

  # netdata:
  netdata:
    image: netdata/netdata:stable
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    ports:
      - "19999:19999"
    networks:
      - web
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 768m
    pids_limit: 512
    stop_grace_period: 30s

  # sentry:
  #   image: getsentry/sentry:nightly
  #   networks:
  #     - web
  #   restart: unless-stopped

volumes:
  postgres_data:

networks:
  web:
    driver: bridge